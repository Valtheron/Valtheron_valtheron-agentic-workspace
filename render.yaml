# Render Blueprint — ein Web-Service aus dem Dockerfile im Repo-Root.
# Render erkennt diese Datei automatisch ("New → Blueprint").
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: valtheron
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt          # EU/DACH — kurze Latenz, DSGVO-freundlich
    plan: starter              # ~7 $/Monat; für Tests ginge auch "free" (schläft ein)
    healthCheckPath: /api/health
    autoDeploy: true           # jeder Push auf den Default-Branch deployt neu
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # Wert im Render-Dashboard eintragen (Secret)
      - key: ADMIN_PASSWORD
        sync: false            # Wert im Render-Dashboard eintragen (Secret)
      - key: JWT_SECRET
        generateValue: true    # Render erzeugt einen langen Zufallswert
      # - key: ANTHROPIC_MODEL
      #   value: claude-opus-4-8   # optional: Modell erzwingen
    disk:
      name: valtheron-data     # SQLite überlebt Deploys/Neustarts
      mountPath: /data
      sizeGB: 1
